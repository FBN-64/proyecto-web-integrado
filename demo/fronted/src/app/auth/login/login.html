<div class="login-wrapper">
  <div class="login-left">
    <div class="brand">
      <div class="brand-icon">+</div>
      <h1>Clinica<br><span>Madre Zoraida</span></h1>
    </div>
    <p class="brand-tagline">Sistema de Gestion Medica</p>
    <div class="stats">
      <div class="stat"><strong>500+</strong><span>Pacientes</span></div>
      <div class="stat"><strong>20+</strong><span>Doctores</span></div>
      <div class="stat"><strong>8</strong><span>Especialidades</span></div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">
      <h2>Bienvenido</h2>
      <p class="subtitle">Inicia sesion para continuar</p>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <div class="input-group">
        <label>Usuario</label>
        <input type="text" placeholder="Ingresa tu usuario" [(ngModel)]="username" />
      </div>

      <div class="input-group">
        <label>Contrasena</label>
        <input type="password" placeholder="Ingresa tu contrasena" [(ngModel)]="password" (keyup.enter)="iniciarSesion()" />
      </div>

      <button class="btn-login" (click)="iniciarSesion()" [disabled]="cargando">
        {{ cargando ? 'Validando...' : 'Iniciar Sesion ->' }}
      </button>

      <div class="register-link">
        No tienes cuenta? <a routerLink="/register">Registrate aqui</a>
      </div>

      <div class="hint">
        <small>Usa un usuario registrado en la tabla <strong>usuarios</strong></small>
      </div>
    </div>
  </div>
</div>
