<div class="container mt-4">
  <h1 class="text-center mb-4 text-primary">⌚ Horarios de las Especialidades</h1>

  <div class="text-center mb-4">
    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAgregarMedico">
      ➕ Agregar médico al horario
    </button>
  </div>

  <div class="table-responsive shadow-sm">
    <table class="table table-bordered table-hover bg-white mb-0">
      <thead class="table-primary text-center">
        <tr>
          <th colspan="2" class="align-middle">Especialidad</th>
          <th *ngFor="let dia of dias" class="align-middle">{{ dia }}</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let esp of especialidades">
          
          <tr>
            <td rowspan="2" class="fw-bold align-middle text-center">{{ esp }}</td>
            <td class="text-center align-middle fw-bold text-secondary bg-light">M</td>
            <td *ngFor="let dia of dias" class="turno-cell text-center align-middle">
              {{ asignaciones[esp]['M'][dia].join(', ') }}
            </td>
          </tr>

          <tr>
            <td class="text-center align-middle fw-bold text-secondary bg-light">T</td>
            <td *ngFor="let dia of dias" class="turno-cell text-center align-middle">
              {{ asignaciones[esp]['T'][dia].join(', ') }}
            </td>
          </tr>

        </ng-container>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalAgregarMedico" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form (ngSubmit)="agregarMedico()">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Agregar Médico al Horario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Médico</label>
            <select class="form-select" name="medico" [(ngModel)]="nuevoHorario.medico" required>
              <option value="" disabled selected>Seleccione un médico</option>
              <option *ngFor="let med of medicos" [value]="med">{{ med }}</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Especialidad</label>
            <select class="form-select" name="especialidad" [(ngModel)]="nuevoHorario.especialidad" required>
              <option value="" disabled selected>Seleccione una especialidad</option>
              <option *ngFor="let esp of especialidades" [value]="esp">{{ esp }}</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Día</label>
            <select class="form-select" name="dia" [(ngModel)]="nuevoHorario.dia" required>
              <option value="" disabled selected>Seleccione un día</option>
              <option *ngFor="let dia of dias" [value]="dia">{{ dia }}</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label class="form-label d-block">Turno</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="turno" value="M" [(ngModel)]="nuevoHorario.turno" required id="turnoM">
              <label class="form-check-label" for="turnoM">Mañana</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="turno" value="T" [(ngModel)]="nuevoHorario.turno" required id="turnoT">
              <label class="form-check-label" for="turnoT">Tarde</label>
            </div>
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
        </div>
      </form>
    </div>
  </div>
</div>
