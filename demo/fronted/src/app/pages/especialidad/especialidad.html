<div class="container mt-4">
  <h1 class="text-center mb-4 text-primary">🩺 Lista de Especialidades</h1>

  <input
    type="text"
    class="form-control mb-3"
    placeholder="🔍 Buscar especialidad..."
    (input)="actualizarFiltro($event)"
  />

  <div class="mb-3">
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#agregarEspecialidadModal">
      ➕ Agregar Especialidad
    </button>
  </div>

  <table class="table table-bordered table-hover shadow-sm bg-white">
    <thead class="table-primary text-center">
      <tr>
        <th>Especialidad</th>
        <th style="width: 150px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let especialidad of especialidadesFiltradas">
        <td>{{ especialidad.nombre }}</td>
        <td class="text-center">
          <button
            class="btn btn-danger btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#confirmModal"
            (click)="prepararEliminar(especialidad)"
          >
            ❌
          </button>
        </td>
      </tr>
      <tr *ngIf="especialidadesFiltradas.length === 0">
        <td colspan="2" class="text-center text-muted">No se encontraron especialidades...</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal fade" id="agregarEspecialidadModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form [formGroup]="especialidadForm" (ngSubmit)="agregarEspecialidad()">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Agregar Especialidad</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nombre de la Especialidad *</label>
            <input type="text" class="form-control" formControlName="nombre" placeholder="Ej. Dermatología" />
            <small class="text-danger mt-1 d-block" *ngIf="especialidadForm.get('nombre')?.invalid && especialidadForm.get('nombre')?.touched">
              El nombre es obligatorio y debe tener mínimo 3 caracteres.
            </small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success" [disabled]="!especialidadForm.valid" [attr.data-bs-dismiss]="especialidadForm.valid ? 'modal' : null">
            Agregar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-danger">
      <div class="modal-body text-center p-4">
        <p class="fs-5 mb-4 text-danger fw-bold">¿Está seguro de eliminar esta especialidad?</p>
        <div class="d-flex justify-content-center gap-3">
          <button type="button" class="btn btn-danger px-4" data-bs-dismiss="modal" (click)="confirmarEliminar()">Sí, eliminar</button>
          <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">No, cancelar</button>
        </div>
      </div>
    </div>
  </div>
</div>
